name: deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle
      - name: Build and verify
        env:
          SKIP_PROMPT: true
        run: |
          ./gradlew setupCarpetmod
          ./gradlew auditFixCheck essentialRuleCheck securityCheck reliabilityCheck schematicPackingCheck schematicInventoryRuleCheck sharedSchematicStoreCheck kisdeRuleCheck vastechRuleCheck createRelease
      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mv build/distributions/Kisde-Carpet_dev.zip "build/distributions/Carpet_${release_version}.zip"
          gh release create "$GITHUB_REF_NAME" "build/distributions/Carpet_${release_version}.zip" --title "Release $GITHUB_REF_NAME"
