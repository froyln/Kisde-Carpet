name: Build on Pull Request

on:
  - pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle
      - name: Build and verify
        env:
          SKIP_PROMPT: true
        run: |
          ./gradlew setupCarpetmod
          ./gradlew auditFixCheck essentialRuleCheck securityCheck reliabilityCheck schematicPackingCheck schematicInventoryRuleCheck sharedSchematicStoreCheck kisdeRuleCheck vastechRuleCheck createRelease
      - uses: actions/upload-artifact@v7
        with:
          name: carpet-dev-${{ github.event.number }}
          path: build/distributions/Kisde-Carpet_dev.zip
          if-no-files-found: error
